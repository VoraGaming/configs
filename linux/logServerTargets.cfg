#####logServerTargets.cfg

[SharedLog]
#logTarget=file:logs/log.txt{c-profile:c-CustomerService:c-stderr}
logTarget=file:logs/customerService.log{c-!CustomerService}
logTarget=file:logs/profile.txt{c-!profile}
#logTarget=file:logs/balance.log{c-!GameBalance}
logTarget=file:logs/startupLog.log{c-*:c+ServerStartup:c+Preload}
#logTarget=file:logs/serverclock.log{c-!ServerClock}
#logTarget=file:logs/population.log{c-!PopulationLog}
#logTarget=file:logs/stderr.txt{c-!stderr}
#logTarget=file:logs/cts.txt{d-!CharacterTransfer:p+TransferServer:d+TransferServer:c+CharacterTransfer}
#logTarget=file:logs/commodities.txt{c-!CommoditiesServer}
logTarget=file:logs/taskProcessDied.txt{c-!TaskProcessDied}

# VoraGaming: log files written by the LogServer (in /swg-main/exe/linux/logs/).
# Only put file: targets in THIS file. A file: line in localOptions.cfg would make every process write it.
#   customerService.log - CustomerService channel: player logins, logouts/disconnects and other CS events.
#   startupLog.log      - ServerStartup and Preload channels (server start progress).
#   taskProcessDied.txt - TaskProcessDied channel (a server process crashed or exited).
#   persistence.log     - saves, logins and shutdowns (SaveTimes, TRACE_LOGIN, CentralServerShutdown,
#                         ServerShutdown, ServerStartup), to help trace lost saves.
#   persistence.log filter: "d-with data for 0 objects" drops the empty "Starting save with data for 0 objects"
#   lines (last matching filter wins; d = message text). The value is in "quotes" because it has spaces.
# A weekly job (swg-main docker/host/swg-log-cleanup.sh) empties any of these over 200 MB.
logTarget="file:logs/persistence.log{c-*:c+SaveTimes:c+TRACE_LOGIN:c+CentralServerShutdown:c+ServerShutdown:c+ServerStartup:d-with data for 0 objects}"

#   spaceIdle.log       - SpaceIdle channel: one line each time a space zone enters or leaves its idle frame rate.
#   spaceIdle.log filter: "c-!SpaceIdle" drops every line whose channel is NOT SpaceIdle, so only SpaceIdle lines are kept.
logTarget="file:logs/spaceIdle.log{c-!SpaceIdle}"

#   shipmove.log - shipmove channel: client ship moves the server rejected (snap-back), with the reason on each line.
logTarget="file:logs/shipmove.log{c-!shipmove}"
